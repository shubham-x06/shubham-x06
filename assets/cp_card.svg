    <rect x="0" y="0" width="200" height="142" rx="10" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1" />
    <rect x="16" y="16" width="36" height="20" rx="4" fill="#1E293B" />
    <text x="34" y="30" fill="#A855F7" font-size="11" font-weight="700" font-family="monospace" text-anchor="middle">CF</text>
    <text x="60" y="31" class="cp-title">Codeforces</text>
    
    <text x="16" y="78" class="cp-val" fill="#A855F7">1634</text>
    <text x="86" y="78" fill="#C084FC" font-size="13" font-weight="700" font-family="monospace">EXPERT</text>
    
    <text x="16" y="105" class="cp-sub">Max Rank: Expert</text>
    <text x="16" y="125" class="mono-sm">IIIT Lucknow • Handle: FRshubham</text>
  </g>

  <!-- Metric 3: CodeChef 3-Star -->
  <g transform="translate(470, 68)">
    <rect x="0" y="0" width="200" height="142" rx="10" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1" />
    <rect x="16" y="16" width="36" height="20" rx="4" fill="#1E293B" />
    <text x="34" y="30" fill="#F97316" font-size="11" font-weight="700" font-family="monospace" text-anchor="middle">CC</text>
    <text x="60" y="31" class="cp-title">CodeChef</text>
    
    <text x="16" y="78" class="cp-val" fill="#F97316">1680</text>
    <text x="86" y="78" fill="#FDBA74" font-size="13" font-weight="700" font-family="monospace">3-STAR</text>
    
    <text x="16" y="105" class="cp-sub">Rank 140 • Starters 170D</text>
    <text x="16" y="125" class="mono-sm">Division 2 Competitor</text>
  </g>

