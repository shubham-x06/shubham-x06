  <g transform="translate(690, 68)">
    <rect x="0" y="0" width="200" height="142" rx="10" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1" />
    <text x="16" y="31" class="cp-title">Contests &amp; Honors</text>
    
    <text x="16" y="60" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#38BDF8">Goldman Sachs '26</text>
    <text x="16" y="76" class="mono-sm">Top 10% Nationwide (CS)</text>
    
    <text x="16" y="98" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#34D399">SpeedForces IIITL</text>
    <text x="16" y="114" class="mono-sm">2nd Place Institute Marathon</text>
    
    <text x="16" y="132" class="mono-sm" fill="#A855F7">HackVega Finalist • Hackofiesta Winner</text>
  </g>
</svg>